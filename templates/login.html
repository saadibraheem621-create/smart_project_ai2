<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zenvy</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .form-box{
            width:380px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            text-align:center;
        }

        .form-box h2{
            margin-bottom:25px;
            color:#222;
        }

        .input-box{
            margin-bottom:15px;
        }

        .input-box input{
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:12px;
            font-size:15px;
            box-sizing:border-box;
        }

        .password-box{
            position:relative;
        }

        .eye-btn{
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            border:none;
            background:none;
            cursor:pointer;
            font-size:18px;
        }

        .remember-box{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:18px;
            font-size:14px;
            color:#555;
        }

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#4ade80;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#22c55e;
        }

        .google-btn{
            margin-top:15px;
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:white;
            border:1px solid #ddd;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:10px;
            cursor:pointer;
            text-decoration:none;
            color:#222;
            font-weight:bold;
            transition:0.3s;
            box-sizing:border-box;
        }

        .google-btn:hover{
            background:#f3f4f6;
        }

        .google-icon{
            width:22px;
            height:22px;
        }

        .links{
            margin-top:18px;
            font-size:14px;
        }

        .links a{
            color:#22c55e;
            text-decoration:none;
        }

        .flash{
            background:#fee2e2;
            color:#dc2626;
            padding:10px;
            border-radius:10px;
            margin-bottom:15px;
            font-size:14px;
        }
    </style>
</head>

<body>

<script>
function togglePassword() {
    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}

window.onload = () => {
    const savedEmail = localStorage.getItem("saved_email");

    if(savedEmail){
        document.getElementById("email").value = savedEmail;
        document.getElementById("remember").checked = true;
    }
}

function saveRemember(){
    const remember = document.getElementById("remember");
    const email = document.getElementById("email").value;

    if(remember.checked){
        localStorage.setItem("saved_email", email);
    }else{
        localStorage.removeItem("saved_email");
    }
}
</script>

<div class="form-box">

    <h2>Login</h2>

    {% with messages = get_flashed_messages() %}
        {% for msg in messages %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="input-box">
            <input
                type="text"
                name="email"
                id="email"
                placeholder="Email or Username"
                required
            >
        </div>

        <div class="input-box password-box">

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword()"
            >
                👁
            </button>

        </div>

        <div class="remember-box">

            <label>
                <input type="checkbox" id="remember">
                Remember me
            </label>

        </div>

        <button
            type="submit"
            class="login-btn"
            onclick="saveRemember()"
        >
            Login
        </button>

    </form>

    <!-- Google Login -->

    <a href="/google-login" class="google-btn">

        <img
            class="google-icon"
            src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
        >

        Continue with Google

    </a>

    <div class="links">

        <p>
            No account?
            <a href="/register">Create account</a>
        </p>

        <p>
            <a href="/forgot_password">Forgot password?</a>
        </p>

    </div>

</div>

</body>
</html>
