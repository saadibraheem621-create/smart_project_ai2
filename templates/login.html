<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zenvy</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .form-box{
            width:380px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            text-align:center;
        }

        .form-box h2{
            margin-bottom:25px;
            color:#222;
        }

        .form-box input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:12px;
            font-size:15px;
            box-sizing:border-box;
        }

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#35c759;
            color:white;
            font-size:16px;
            cursor:pointer;
            font-weight:bold;
        }

        .login-btn:hover{
            background:#28b44b;
        }

        .flash{
            background:#ffe5e5;
            color:#cc0000;
            padding:10px;
            border-radius:10px;
            margin-bottom:15px;
        }

        .remember-box{
            display:flex;
            align-items:center;
            gap:8px;
            margin-bottom:15px;
            font-size:14px;
        }

        .password-box{
            position:relative;
        }

        .password-box input{
            padding-right:45px;
        }

        .eye-btn{
            position:absolute;
            right:12px;
            top:35%;
            transform:translateY(-50%);
            border:none;
            background:none;
            cursor:pointer;
            font-size:18px;
        }

        .links{
            margin-top:15px;
            font-size:14px;
        }

        .links a{
            color:#35c759;
            text-decoration:none;
        }

        .forgot{
            display:block;
            margin-top:10px;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>Login</h2>

    {% with messages = get_flashed_messages() %}
        {% for msg in messages %}
            <p class="flash">{{ msg }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="text"
               name="email"
               id="email"
               placeholder="Email or Username"
               required>

        <div class="password-box">

            <input type="password"
                   name="password"
                   id="password"
                   placeholder="Password"
                   required>

            <button type="button"
                    class="eye-btn"
                    onclick="togglePassword()">
                👁️
            </button>

        </div>

        <div class="remember-box">
            <input type="checkbox"
                   id="remember">

            <label for="remember">
                Remember me
            </label>
        </div>

        <button type="submit"
                class="login-btn"
                onclick="saveRemember()">
            Login
        </button>

    </form>

    <div class="links">
      <p class="register-link">
        No account?
        <a href="/register">Create account</a>
    </p>

        <a href="/forgot-password" class="forgot">
            Forgot password?
        </a>

        <br><br>

        No account?
        <a href="/register">
            Create account
        </a>

    </div>

</div>

<script>

function togglePassword() {

    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}

window.onload = () => {

    const savedEmail = localStorage.getItem("saved_email");

    if(savedEmail){

        document.getElementById("email").value = savedEmail;

        document.getElementById("remember").checked = true;
    }
}

function saveRemember(){

    const remember = document.getElementById("remember");

    const email = document.getElementById("email").value;

    if(remember.checked){

        localStorage.setItem("saved_email", email);

    }else{

        localStorage.removeItem("saved_email");
    }
}

</script>

</body>
</html>
