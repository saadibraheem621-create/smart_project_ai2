<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:20px;
            width:350px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            text-align:center;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:1px solid #ddd;
            border-radius:12px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            margin-top:15px;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#35c759;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        a{
            display:block;
            margin-top:15px;
            color:#35c759;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Forgot Password</h2>

    <p>Enter your email to reset password</p>

    <input type="email" placeholder="Enter your email">

    <button>Send Reset Link</button>

    <a href="/login">Back to login</a>

</div>

</body>
</html>
