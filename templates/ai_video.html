<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            text-align:center;
            padding-top:80px;
        }

        .box{
            width:500px;
            margin:auto;
            background:#1e293b;
            padding:30px;
            border-radius:20px;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            margin-top:20px;
        }

        button{
            margin-top:20px;
            padding:15px 30px;
            border:none;
            border-radius:10px;
            background:#6366f1;
            color:white;
            font-size:18px;
            cursor:pointer;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>AI Video Generator</h1>

        <p>Your Credits: {{ credits }}</p>

        <form method="POST">

            <input type="text"
                   name="prompt"
                   placeholder="Describe your video...">

            <button type="submit">
                Generate Video
            </button>

        </form>
    </div>

</body>
</html>
